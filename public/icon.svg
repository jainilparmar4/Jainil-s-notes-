<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Floating particles / spark -->
  <circle cx="100" cy="110" r="14" fill="#fbbf24" opacity="0.8" />
  <circle cx="410" cy="130" r="10" fill="#38bdf8" opacity="0.7" />
  <circle cx="420" cy="380" r="12" fill="#a855f7" opacity="0.7" />

  <!-- Central Notebook / Study Tablet Emblem -->
  <g filter="url(#glow)" transform="translate(106, 96)">
    <!-- Book Base / Cover -->
    <path d="M 30 20 C 30 10, 40 0, 50 0 L 260 0 C 275 0, 285 10, 285 25 L 285 285 C 285 295, 275 305, 260 305 L 50 305 C 40 305, 30 295, 30 285 Z" fill="#ffffff" />
    
    <!-- Spine binding -->
    <path d="M 15 15 C 15 5, 25 0, 35 0 L 60 0 L 60 305 L 35 305 C 25 305, 15 300, 15 290 Z" fill="#4338ca" />
    
    <!-- Gold Bookmark Ribbon -->
    <path d="M 190 0 L 230 0 L 230 100 L 210 80 L 190 100 Z" fill="url(#accentGrad)" />

    <!-- Handwritten lines on notebook -->
    <line x1="85" y1="60" x2="165" y2="60" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
    <line x1="85" y1="95" x2="245" y2="95" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="85" y1="130" x2="245" y2="130" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="85" y1="165" x2="245" y2="165" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="85" y1="200" x2="210" y2="200" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Play button overlay symbol for AI Video -->
    <circle cx="165" cy="245" r="28" fill="#f43f5e" />
    <polygon points="158,233 178,245 158,257" fill="#ffffff" />
  </g>

  <!-- Grade Badge: 9-12 -->
  <g transform="translate(146, 420)">
    <rect width="220" height="46" rx="23" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3" />
    <text x="110" y="30" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="2">CLASSES 9 • 10 • 11 • 12</text>
  </g>
</svg>
